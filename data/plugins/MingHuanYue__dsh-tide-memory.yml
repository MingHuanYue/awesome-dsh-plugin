name: MingHuanYue/dsh-tide-memory
category: memory
description:
  en: 'Tide Memory: a long-term memory that forgets on purpose. It keeps what matters, lets the rest fade on its own, and when two notes disagree it says so instead of handing you both. Runs locally — no cloud, no embeddings, no extra tokens.'
  zh: '潮汐记忆：一份会忘事的长期记忆。该记的记着，没被想起来的自己淡掉；前后说法对不上时，它把旧的那句缩成注脚，而不是两条并排塞给你。本地跑，不联网，不多花一分钱。'
