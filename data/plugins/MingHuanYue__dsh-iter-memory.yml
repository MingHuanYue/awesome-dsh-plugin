name: MingHuanYue/dsh-iter-memory
category: memory
description:
  en: "Iteration Memory: a mood curve that drifts back to baseline by itself, plus messages it occasionally starts on its own. A low mood makes it likelier to stay quiet; speaking, and being answered, moves the mood again."
  zh: "迭代记忆：一条会自己退回基线的状态曲线，加不定时自己开口。状态低时更容易忍住不说，说了有没有人应又会把状态改掉。"
